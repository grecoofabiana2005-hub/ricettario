<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fffaf6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Ricettari" />
  <meta name="description" content="I tuoi ricettari personali, sincronizzati su tutti i dispositivi." />
  <title>I miei ricettari</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <input id="photoInput" type="file" accept="image/*" hidden />
  <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden />
  <input id="backupInput" type="file" accept="application/json,.json" hidden />
  <div id="pdfStage" class="pdf-stage" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    window.addEventListener('error', function(e){
      const app=document.getElementById('app');
      if(app && !app.innerHTML.trim()){
        app.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#fffaf6;font-family:system-ui"><section style="max-width:420px;background:white;border:1px solid #eadfd7;border-radius:24px;padding:24px;box-shadow:0 12px 35px rgba(68,45,36,.08)"><h1 style="font-family:Georgia,serif;margin-top:0">Ricettari</h1><p>Si è verificato un errore durante il caricamento. Aggiorna la pagina. Se continua, sostituisci i file dell’app con la versione corretta.</p></section></main>';
      }
    });
  </script>
  <script src="app.js"></script>
</body>
</html>
